
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<style>
body{font-family:Arial;background:#f1f5f9;color:#0f172a;margin:0}
header{background:#0f172a;color:white;padding:20px}
main{max-width:900px;margin:35px auto;padding:20px}
.card{background:white;padding:25px;border-radius:12px;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #ddd}
button{padding:10px 20px;background:#ef4444;color:white;border:0;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<header><h2>Cloudnautic Dashboard</h2></header>
<main>
<div class="card">
<h2>Welcome, {{ user.name }}!</h2>
<p><b>User ID:</b> {{ user.id }}</p>
<p><b>Email:</b> {{ user.email }}</p>
<p><b>Registered:</b> {{ user.created_at }}</p>
<form action="{{ url_for('logout') }}" method="POST">
<button type="submit">Logout</button>
</form>
</div>

<div class="card">
<h3>Recent Login History</h3>
<table>
<tr><th>Login Time</th></tr>
{% for record in history %}
<tr><td>{{ record.login_time }}</td></tr>
{% else %}
<tr><td>No login history found.</td></tr>
{% endfor %}
</table>
</div>
</main>
</body>
</html>
