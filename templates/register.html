
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;display:grid;place-items:center;min-height:100vh;margin:0}
.card{background:#1e293b;padding:30px;border-radius:12px;width:320px;max-width:85vw}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:0;border-radius:6px}
button{background:#38bdf8;font-weight:bold;cursor:pointer}
a{color:#38bdf8}
</style>
</head>
<body>
<div class="card">
<h2>Create Account</h2>
{% for message in get_flashed_messages() %}
<p>{{ message }}</p>
{% endfor %}
<form method="POST">
<input name="name" placeholder="Full Name" required>
<input name="email" type="email" placeholder="Email" required>
<input name="password" type="password"
       placeholder="Password (min 8 characters)"
       minlength="8" required>
<button type="submit">Register</button>
</form>
<a href="{{ url_for('login') }}">Back to Login</a>
</div>
</body>
</html>
